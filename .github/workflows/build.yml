name: Build Grahamanack

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended calibre
      - run: npm ci
      - run: npm run build:data
      - run: npm run build:books
      - run: npm run build:site
      - name: Upload book artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grahamanack-books
          path: public/downloads/
